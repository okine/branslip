[package]
name = "shizhijian"
version = "10.2.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shizhijian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
base64 = "0.22"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# ── Android 构建专用 ──────────────────────────────────────────────
# vswhom-sys 是 tauri-build → tauri-winres → embed-resource 带上来的
# 一个 Windows 专用 C++ 小 crate（只用来写 exe 的资源/透明效果），
# 走 cc 用 cl.exe 编译。dev profile 会带 -Z7（完整调试信息），
# 在这台机器的 MSVC 14.44 上 cl 直接报
#   D8050: 无法执行 c1xx.dll：未能将命令行放入调试记录中
# 桌面构建不受影响（release 不带 -Z7），只有 cargo build --target
# aarch64-linux-android 的 debug 会踩到，于是 `tauri android dev` 必挂。
# 给这一个包关掉调试信息即可；Rust 侧其它 crate 的 debug 信息不受影响。
[profile.dev.package.vswhom-sys]
debug = false

# ── 本地 vendored 插件 ────────────────────────────────────────────
# 这三个插件的 build script（tauri-plugin 的 mobile::setup）会往
# 「插件自己的源码目录」里写东西：permissions/autogenerated、android/.tauri、
# android/.tauri/tauri-api。源码在 %USERPROFILE%\.cargo\registry\src 时，
# 这台机器上的构建脚本进程没有写权限，于是 tauri android dev 报
#   tauri-plugin: failed to create .tauri directory: 拒绝访问。(os error 5)
# 改成项目内的本地副本后，全部写入都落在仓库里，构建不再依赖用户目录权限。
[patch.crates-io]
tauri-plugin-fs     = { path = "vendor/tauri-plugin-fs" }
tauri-plugin-dialog = { path = "vendor/tauri-plugin-dialog" }
tauri-plugin-opener = { path = "vendor/tauri-plugin-opener" }

